<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Todoist Post with Date</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #DE483A; /* Todoist brand red */
      font-size: 18px;
    }
    #post-todoist {
      background-color: #DE483A; /* Todoist brand red */
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 15px;
      transition: background-color 0.2s;
    }
    #post-todoist:hover {
      background-color: #c93e30;
    }
    #post-todoist:disabled {
      background-color: #a9a9a9;
      cursor: not-allowed;
    }
    #url, #title {
      word-wrap: break-word;
      padding: 0 10px;
    }
    strong, label {
      margin-top: 10px;
      display: inline-block;
    }
    #due-date-picker {
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
    #token-section {
      margin-top: 12px;
      font-size: 12px;
      text-align: left;
      padding: 0 10px;
    }
    #todoist-token {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-top: 4px;
      margin-bottom: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #save-token {
      background-color: #4a4a4a;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Todoist へ送る</h1>
  <strong>Title:</strong> <div id="title"></div>
  <strong>URL:</strong> <div id="url"></div>
  <br>
  <label for="due-date-picker"><strong>Due Date:</strong></label>
  <input type="date" id="due-date-picker">
  <div id="token-section">
    <label for="todoist-token"><strong>Todoist API Token:</strong></label>
    <input type="password" id="todoist-token" placeholder="Paste your API token">
    <button id="save-token">Save Token</button>
  </div>
  <button id="post-todoist">Post to Todoist</button>
  <div id="status"></div>
  <script src="todo_date.js"></script>
</body>
</html>
